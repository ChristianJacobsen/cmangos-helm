name: chart-e2e

# CI has no game client, so mangosd cannot start here. The test covers the
# database installation, the accounts and realmd.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag to test
        default: latest
  schedule:
    - cron: "42 3 * * *" # nightly 03:42 UTC

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR names are lowercase.
      - name: image namespace
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: e2e

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: load images into kind
        run: |
          set -euo pipefail
          for img in server db; do
            docker pull "$REGISTRY/cmangos-classic-$img:$TAG"
            kind load docker-image --name e2e "$REGISTRY/cmangos-classic-$img:$TAG"
          done

      - name: install
        run: |
          set -euo pipefail
          helm install cmangos charts/cmangos -n cmangos --create-namespace \
            --set images.server.registry=ghcr.io \
            --set "images.server.repository=$OWNER/cmangos-classic-server" \
            --set "images.server.tag=$TAG" --set images.server.digest= \
            --set images.db.registry=ghcr.io \
            --set "images.db.repository=$OWNER/cmangos-classic-db" \
            --set "images.db.tag=$TAG" --set images.db.digest= \
            --set clientData.source=none \
            --set realmd.service.type=ClusterIP \
            --set mangosd.service.type=ClusterIP \
            --set 'dbInit.accounts[0].username=e2e' \
            --set 'dbInit.accounts[0].password=e2epass' \
            --set 'dbInit.accounts[0].gmlevel=3'

      - name: wait for db-init
        run: kubectl -n cmangos wait --for=condition=complete job -l app.kubernetes.io/component=db-init --timeout=1800s

      - name: wait for realmd
        run: kubectl -n cmangos rollout status deploy/cmangos-realmd --timeout=600s

      - name: check the databases
        run: |
          set -euo pipefail
          pw="$(kubectl -n cmangos get secret cmangos-db -o jsonpath='{.data.root-password}' | base64 -d)"
          q() { kubectl -n cmangos exec cmangos-mysql-0 -- env MYSQL_PWD="$pw" mysql -uroot -N -e "$1"; }
          q "SELECT username, gmlevel FROM classicrealmd.account" | tee /dev/stderr | grep -q '^E2E	3$'
          test "$(q "SELECT COUNT(*) FROM classicrealmd.account WHERE username = 'ADMINISTRATOR'")" = 0
          test "$(q "SELECT COUNT(*) FROM classicmangos.creature_template")" -gt 1000
          q "SELECT v FROM classicmangos.cmangos_helm_state WHERE k = 'world_content'"

      - name: log in as the e2e account (SRP6 against realmd)
        run: |
          set -euo pipefail
          kubectl -n cmangos run auth-check --restart=Never \
            --image="$REGISTRY/cmangos-classic-db:$TAG" --image-pull-policy=IfNotPresent \
            --env=AUTH_USERNAME=e2e --env=AUTH_PASSWORD=e2epass \
            --command -- cmangos-auth-check --host cmangos-realmd
          kubectl -n cmangos wait --for=jsonpath='{.status.phase}'=Succeeded pod/auth-check --timeout=120s
          kubectl -n cmangos logs pod/auth-check

      - name: upgrade (db-init must be idempotent)
        run: |
          set -euo pipefail
          helm upgrade cmangos charts/cmangos -n cmangos --reuse-values --set dbInit.realm.name=e2e-upgrade
          kubectl -n cmangos wait --for=condition=complete job/cmangos-db-init-r2 --timeout=1200s
          kubectl -n cmangos logs job/cmangos-db-init-r2 | grep -q 'world content is current'

      - name: diagnose on failure
        if: failure()
        run: |
          kubectl -n cmangos get pods -o wide || true
          kubectl -n cmangos get jobs || true
          for j in $(kubectl -n cmangos get jobs -o name); do
            kubectl -n cmangos logs "$j" --tail=100 || true
          done
          for p in $(kubectl -n cmangos get pods -o name); do
            kubectl -n cmangos describe "$p" | tail -30 || true
          done
