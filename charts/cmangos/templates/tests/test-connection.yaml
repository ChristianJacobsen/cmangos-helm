{{- $fullname := include "cmangos.fullname" . -}}
{{- $account := first (.Values.dbInit.accounts | default list) -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-connection-test" $fullname }}
  labels:
    {{- include "cmangos.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  {{- include "cmangos.pullSecrets" . | nindent 2 }}
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: test
      image: {{ include "cmangos.image" (dict "ctx" . "component" "db") }}
      imagePullPolicy: {{ .Values.imagePullPolicy }}
      command:
        - bash
        - -c
        - |
          set -euo pipefail
          connect_timeout_seconds=5
          timeout "$connect_timeout_seconds" bash -c '</dev/tcp/{{ $fullname }}-realmd/{{ .Values.realmd.service.port }}'
          echo "realmd {{ $fullname }}-realmd:{{ .Values.realmd.service.port }} reachable"
          timeout "$connect_timeout_seconds" bash -c '</dev/tcp/{{ $fullname }}-mangosd/{{ .Values.mangosd.service.port }}'
          echo "mangosd {{ $fullname }}-mangosd:{{ .Values.mangosd.service.port }} reachable"
          {{- if $account }}
          cmangos-auth-check --expansion {{ .Values.expansion }} --host {{ $fullname }}-realmd --port {{ .Values.realmd.service.port }} --expect-online
          {{- end }}
      {{- if $account }}
      env:
        - name: AUTH_USERNAME
          value: {{ $account.username | quote }}
        - name: AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              {{- if $account.existingSecret }}
              name: {{ $account.existingSecret }}
              key: {{ $account.passwordKey | default "password" }}
              {{- else }}
              name: {{ printf "%s-accounts" $fullname }}
              key: account-0
              {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
