apiVersion: v2
name: cmangos
description: |-
  CMaNGOS World of Warcraft private server for Classic (1.12.1), The Burning
  Crusade (2.4.3), or Wrath of the Lich King (3.3.5a): realmd, mangosd, MySQL,
  database installation, and client-data extraction. Playerbots and the
  auction house bot are compiled into the images and off by default.
